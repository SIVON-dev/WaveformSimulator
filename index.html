<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Waveform Simulator</title>
<meta name="description" content="Stack, sum and listen to up to six oscillators, or load any chord as sine waves.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    Design notes (why each choice exists)
    - Dark theme: this is a bench instrument; the scope screen is the product and traces read best on black.
    - Chrome is warm graphite and paper white so the six oscillator colours are the only saturated colour on the page.
    - One accent, phosphor green, marks the instrument itself: graticule, timebase readout, active chord, focus.
    - Each oscillator carries its own colour through its shape glyph, slider thumb and selected shape (identity motif).
    - IBM Plex Sans for labels, Plex Mono only for numbers (Hz, %, ms/div) so readouts line up in tabular figures.
  */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --scope-height: 280px;
    --bg: #111214;
    --panel: #18191c;
    --panel-2: #212327;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.16);
    --text: #ECE8DF;
    --text-2: #B3B0A7;
    --text-3: #918E86;
    --accent: #A8DB72;
    --accent-ink: #14200A;
    --screen: #0A0C0B;
    --stop: #F2837A;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --r-sm: 6px;
    --r-md: 10px;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
    padding: 2.5rem 1.5rem 2rem;
  }

  .page { max-width: 1080px; margin: 0 auto; }

  /* Controls show they can be used */
  button, label[for], input[type=range], input[type=checkbox], .switch { cursor: pointer; }
  button:disabled { cursor: not-allowed; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Header ---------- */
  .site-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin-bottom: 1.25rem;
  }

  .site-header h1 {
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .site-header p {
    color: var(--text-2);
    font-size: 0.9375rem;
  }

  /* ---------- Scope (focal point) ---------- */
  #canvas-wrap {
    position: relative;
    border-radius: var(--r-md);
    overflow: hidden;
    border: 1px solid var(--line-2);
    background: var(--screen);
    box-shadow: inset 0 0 0 4px #141615;
  }

  canvas {
    display: block;
    width: 100%;
    height: var(--scope-height);
  }

  .scope-timebase {
    position: absolute;
    top: 12px;
    left: 14px;
    z-index: 2;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    background: rgba(10,12,11,0.8);
    padding: 1px 4px;
    border-radius: 3px;
    pointer-events: none;
  }

  .legend {
    position: absolute;
    top: 12px;
    right: 14px;
    max-width: calc(100% - 140px);
    display: flex;
    gap: 4px 14px;
    flex-wrap: wrap;
    justify-content: flex-end;
    pointer-events: none;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    background: rgba(10,12,11,0.8);
    padding: 1px 4px;
    border-radius: 3px;
  }

  .legend-line {
    width: 16px;
    height: 2px;
    border-radius: 1px;
  }

  .legend-line.sum {
    background: repeating-linear-gradient(90deg, var(--text) 0, var(--text) 4px, transparent 4px, transparent 7px);
  }

  /* ---------- Transport toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .toolbar-group { display: flex; align-items: center; gap: 8px; }
  .toolbar-group.end { margin-left: auto; gap: 16px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 40px;
    padding: 0 16px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--r-sm);
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--text);
    transition: background-color 0.12s, border-color 0.12s, color 0.12s;
  }

  .btn:hover:not(:disabled) { background: var(--panel-2); border-color: rgba(255,255,255,0.3); }
  .btn:active:not(:disabled) { background: #2a2c31; }
  .btn:disabled { color: var(--text-3); border-style: dashed; }

  #playBtn {
    min-width: 104px;
    background: var(--text);
    border-color: var(--text);
    color: #141414;
  }
  #playBtn:hover { background: #fff; border-color: #fff; }
  #playBtn:active { background: #d9d5cc; }

  #playBtn .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #141414;
  }

  #playBtn.playing { background: transparent; border-color: var(--stop); color: var(--stop); }
  #playBtn.playing:hover { background: rgba(242,131,122,0.1); }
  #playBtn.playing .dot { background: var(--stop); border-radius: 1px; }

  .timebase-cluster {
    display: flex;
    align-items: center;
    border-radius: var(--r-sm);
    border: 1px solid var(--line-2);
    background: var(--panel);
  }

  .timebase-btn {
    width: 40px;
    height: 38px;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1;
    border-radius: var(--r-sm);
  }
  .timebase-btn:hover:not(:disabled) { background: var(--panel-2); }
  .timebase-btn:active:not(:disabled) { background: #2a2c31; }
  .timebase-btn:disabled { color: #55534e; }

  .timebase-value {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    width: 104px;
    text-align: center;
  }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    color: var(--text-2);
    user-select: none;
  }
  .switch:hover { color: var(--text); }
  .switch input { width: 16px; height: 16px; accent-color: var(--accent); }

  .audio-status {
    margin-top: 8px;
    color: var(--stop);
    font-size: 13px;
  }
  .audio-status:empty { display: none; }

  /* ---------- Oscillator rows ---------- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 12px;
    flex-wrap: wrap;
    margin: 2rem 0 0.625rem;
  }

  .section-head h2 {
    font-size: 1rem;
    font-weight: 600;
  }

  .section-head .hint {
    color: var(--text-2);
    font-size: 13px;
  }

  .section-head .hint.mono { font-family: var(--mono); color: var(--accent); }

  .controls {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--panel);
  }

  .wave-row {
    --wc: var(--text);
    display: grid;
    grid-template-columns: 96px minmax(0, 1.35fr) minmax(0, 1fr) auto 40px;
    grid-template-areas: "id freq amp shape rm";
    gap: 20px;
    align-items: center;
    padding: 14px 16px;
  }

  .wave-row + .wave-row { border-top: 1px solid var(--line); }

  .wave-id {
    grid-area: id;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-2);
    font-size: 13px;
  }

  .wave-id svg { width: 32px; height: 16px; flex-shrink: 0; color: var(--wc); }
  .wave-id .muted-tag { display: none; }

  .wave-row.muted .wave-id svg { opacity: 0.35; }
  .wave-row.muted .wave-id .muted-tag { display: inline; color: var(--text-3); }
  .wave-row.muted .wave-id .wave-num { display: none; }

  .p-freq { grid-area: freq; }
  .p-amp { grid-area: amp; }
  .p-shape { grid-area: shape; }
  .remove-btn { grid-area: rm; }

  .param { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .param-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 28px;
  }

  .param-head label, .param-head .label {
    font-size: 12px;
    color: var(--text-2);
  }

  .param-val {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .freq-field {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-2);
  }

  .freq-input {
    width: 84px;
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid var(--line-2);
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .freq-input:hover { border-color: rgba(255,255,255,0.3); }
  .freq-input:focus { border-color: var(--accent); outline: none; }
  .freq-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Sliders: plain track, thumb in the oscillator's colour */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 24px;
    background: transparent;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: var(--line-2);
  }
  input[type=range]::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: var(--line-2);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--wc);
    border: 2px solid var(--panel);
    transition: transform 0.1s;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--wc);
    border: 2px solid var(--panel);
    transition: transform 0.1s;
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); }
  input[type=range]:hover::-moz-range-thumb { transform: scale(1.15); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.3); }
  input[type=range]:active::-moz-range-thumb { transform: scale(1.3); }

  .wave-type {
    display: flex;
    gap: 4px;
  }

  .wave-type button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 32px;
    border-radius: var(--r-sm);
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--text-3);
    transition: color 0.1s, border-color 0.1s, background-color 0.1s;
  }
  .wave-type button svg { width: 22px; height: 11px; pointer-events: none; }
  .wave-type button:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  .wave-type button:active { background: var(--panel-2); }
  .wave-type button.active {
    color: var(--wc);
    border-color: var(--wc);
    background: color-mix(in srgb, var(--wc) 14%, transparent);
  }

  .remove-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-3);
    transition: color 0.1s, border-color 0.1s, background-color 0.1s;
  }
  .remove-btn svg { width: 14px; height: 14px; pointer-events: none; }
  .remove-btn:hover { color: var(--stop); border-color: rgba(242,131,122,0.4); }
  .remove-btn:active { background: rgba(242,131,122,0.12); }

  .empty-state {
    padding: 28px 16px;
    text-align: center;
    color: var(--text-2);
  }

  /* ---------- Chords ---------- */
  .chord-table {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--panel);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .chord-row {
    display: grid;
    grid-template-columns: 36px 1fr;
    align-items: center;
    gap: 4px;
  }

  .chord-row-label {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-2);
    text-align: center;
  }

  .chord-buttons {
    display: grid;
    grid-template-columns: repeat(11, minmax(0, 1fr));
    gap: 4px;
  }

  .chord-btn {
    font-family: var(--mono);
    font-size: 13px;
    min-height: 32px;
    padding: 0 2px;
    min-width: 0;
    border-radius: 4px;
    border: 1px solid transparent;
    background: var(--panel-2);
    color: var(--text-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: border-color 0.1s, color 0.1s, background-color 0.1s;
  }
  .chord-btn:hover { color: var(--text); border-color: var(--line-2); background: #282a2f; }
  .chord-btn:active { background: #303238; }
  .chord-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 500;
  }

  .site-footer {
    margin-top: 1.5rem;
    color: var(--text-3);
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }

  /* ---------- Tablet ---------- */
  @media (max-width: 900px) {
    .wave-row {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      grid-template-areas:
        "id id rm"
        "freq amp shape";
      gap: 8px 20px;
    }
  }

  /* ---------- Phone ---------- */
  @media (max-width: 640px) {
    :root { --scope-height: 220px; }

    body {
      padding: max(1.25rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }

    .site-header h1 { font-size: 1.25rem; }
    .site-header p { font-size: 0.875rem; }

    .legend { top: auto; bottom: 10px; right: 10px; left: 10px; max-width: none; justify-content: flex-start; }
    .legend-item { font-size: 11px; }
    .scope-timebase { left: 10px; top: 10px; }

    .toolbar { gap: 8px; }
    .toolbar-group.start { width: 100%; }
    .toolbar-group.start .btn { flex: 1 1 0; min-height: 44px; }
    .toolbar-group.end { margin-left: 0; width: 100%; justify-content: space-between; }
    .timebase-btn { width: 44px; height: 42px; }
    .switch { min-height: 44px; }

    .wave-row {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "id rm"
        "freq freq"
        "amp amp"
        "shape shape";
      gap: 6px;
      padding: 10px 12px 14px;
    }
    .param-head { min-height: 32px; }
    .freq-input { width: 96px; padding: 6px 8px; font-size: 16px; }
    input[type=range] { height: 32px; }
    input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -9px; }
    input[type=range]::-moz-range-thumb { width: 18px; height: 18px; }
    .p-shape .param-head { display: none; }
    .wave-type { gap: 6px; }
    .wave-type button { flex: 1 1 0; width: auto; height: 44px; }
    .remove-btn { width: 44px; height: 44px; }

    .chord-table { padding: 6px; gap: 10px; }
    .chord-row { grid-template-columns: 1fr; gap: 4px; }
    .chord-row-label { text-align: left; padding-left: 2px; }
    .chord-buttons { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .chord-btn { min-height: 44px; }
  }
</style>
</head>
<body>
<div class="page">

<header class="site-header">
  <h1>Waveform Simulator</h1>
  <p>Stack, sum and listen to up to six oscillators.</p>
</header>

<main>
  <section aria-label="Oscilloscope">
    <div id="canvas-wrap">
      <canvas id="waveCanvas" role="img" aria-label="Oscilloscope view of the current waves"></canvas>
      <div class="scope-timebase" id="scopeTimebase"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="toolbar">
      <div class="toolbar-group start">
        <button type="button" class="btn" id="playBtn"><span class="dot" aria-hidden="true"></span><span id="playLabel">Play</span></button>
        <button type="button" class="btn" id="addBtn">Add wave</button>
      </div>
      <div class="toolbar-group end">
        <div class="timebase-cluster" role="group" aria-label="Timebase">
          <button type="button" class="timebase-btn" id="tbMinus" aria-label="Zoom in (shorter time per division)">−</button>
          <span class="timebase-value" id="tbLabel" aria-live="polite"></span>
          <button type="button" class="timebase-btn" id="tbPlus" aria-label="Zoom out (longer time per division)">+</button>
        </div>
        <label class="switch" for="showSum">
          <input type="checkbox" id="showSum">
          Show sum
        </label>
      </div>
    </div>
    <p class="audio-status" id="audioStatus" role="status"></p>
  </section>

  <section aria-labelledby="wavesTitle">
    <div class="section-head">
      <h2 id="wavesTitle">Waves</h2>
      <span class="hint" id="waveCount"></span>
    </div>
    <div class="controls" id="waveControls"></div>
  </section>

  <section aria-labelledby="chordsTitle">
    <div class="section-head">
      <h2 id="chordsTitle">Chords</h2>
      <span class="hint" id="chordHint">Pick a chord to load its notes as sine waves</span>
    </div>
    <div class="chord-table" id="chordTable"></div>
  </section>
</main>

<footer class="site-footer">
  <p>Notes use equal temperament with A4 at 440 Hz. Chord roots sit in octave 4.</p>
</footer>

</div>

<script>
const MAX_WAVES = 6;
const MAX_HZ = 20000;
const PTS = 300;
const HORIZ_DIVS = 8;
const MS_PER_DIV_STEPS = [
  0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500,
];
const DEFAULT_MS_PER_DIV_INDEX = Math.max(0, MS_PER_DIV_STEPS.indexOf(1));

const COLORS = ['#378ADD', '#D4537E', '#1D9E75', '#EF9F27', '#7F77DD', '#D85A30'];
const WAVE_TYPES = ['sine', 'triangle', 'square', 'sawtooth'];

const MIN_LOG_HZ = 50;
const HZ_SLIDER_RATIO = MAX_HZ / MIN_LOG_HZ;
const INV_LOG_HZ_RANGE = 1 / Math.log10(HZ_SLIDER_RATIO);

const C_MAJOR_DEFAULT = [
  { type: 'sine', hz: 261.63, amp: 0.5, color: COLORS[0] },
  { type: 'sine', hz: 329.63, amp: 0.5, color: COLORS[1] },
  { type: 'sine', hz: 392.0, amp: 0.5, color: COLORS[2] },
];

const NOTE_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const CHORD_QUALITIES = [
  { key: 'maj',  label: 'major',      suffix: '',     intervals: [0, 4, 7] },
  { key: 'min',  label: 'minor',      suffix: 'm',    intervals: [0, 3, 7] },
  { key: 'dim',  label: 'diminished', suffix: '°',    intervals: [0, 3, 6] },
  { key: 'aug',  label: 'augmented',  suffix: '+',    intervals: [0, 4, 8] },
  { key: 'sus2', label: 'sus2',       suffix: 'sus2', intervals: [0, 2, 7] },
  { key: 'sus4', label: 'sus4',       suffix: 'sus4', intervals: [0, 5, 7] },
  { key: 'dom7', label: 'dominant 7', suffix: '7',    intervals: [0, 4, 7, 10] },
  { key: 'maj7', label: 'major 7',    suffix: 'maj7', intervals: [0, 4, 7, 11] },
  { key: 'min7', label: 'minor 7',    suffix: 'm7',   intervals: [0, 3, 7, 10] },
  { key: 'hdim7', label: 'half-dim 7', suffix: 'ø7',  intervals: [0, 3, 6, 10] },
  { key: 'dim7', label: 'dim 7',      suffix: '°7',   intervals: [0, 3, 6, 9] },
];

let waves = [];
let nextId = 0;
let audioCtx = null;
let oscillators = {};
let gainNodes = {};
let masterGain = null;
let isPlaying = false;
let msPerDivStepIndex = DEFAULT_MS_PER_DIV_INDEX;

function formatMsPerDivLabel(ms) {
  let s;
  if (ms >= 1) {
    s = Number.isInteger(ms) ? String(ms) : ms.toFixed(1).replace(/\.0$/, '');
  } else {
    s = ms < 0.1 ? ms.toFixed(2) : ms.toFixed(1);
  }
  return s + ' ms/div';
}

function hzToSliderNorm(hz) {
  if (hz <= 0) return 0;
  if (hz >= MAX_HZ) return 1;
  if (hz <= MIN_LOG_HZ) return (hz / MIN_LOG_HZ) * 0.001;
  return Math.log10(hz / MIN_LOG_HZ) * INV_LOG_HZ_RANGE;
}

function sliderNormToHz(p) {
  const x = Math.min(1, Math.max(0, p));
  if (x <= 0) return 0;
  if (x >= 0.9999) return MAX_HZ;
  if (x <= 0.001) return Math.min(MIN_LOG_HZ, Math.max(1, Math.round(x * 50000)));
  return Math.min(MAX_HZ, Math.max(MIN_LOG_HZ, Math.round(MIN_LOG_HZ * Math.pow(HZ_SLIDER_RATIO, x))));
}

function formatHz(hz) {
  const s = Number(hz.toFixed(10)).toString();
  if (!s.includes('.')) return s;
  return s.replace(/\.?0+$/, '').replace(/\.$/, '');
}

function formatFvHz(hz) {
  return formatHz(hz) + ' Hz';
}

function sanitizeHzInput(text) {
  const cleaned = text.replace(/[^0-9.]/g, '');
  const dot = cleaned.indexOf('.');
  if (dot === -1) return cleaned;
  return cleaned.slice(0, dot + 1) + cleaned.slice(dot + 1).replace(/\./g, '');
}

function parseHzCommit(raw) {
  if (raw === '' || raw === '.') return null;
  const n = parseFloat(raw);
  if (Number.isNaN(n)) return null;
  return Math.max(0, Math.min(MAX_HZ, n));
}

function waveValueAtTime(w, tSec) {
  if (w.amp === 0 || w.hz === 0) return 0;
  const phase = 2 * Math.PI * w.hz * tSec;
  switch (w.type) {
    case 'triangle':
      return (2 / Math.PI) * Math.asin(Math.sin(phase));
    case 'square':
      return Math.sin(phase) >= 0 ? 1 : -1;
    case 'sawtooth': {
      const frac = ((phase / (2 * Math.PI)) % 1 + 1) % 1;
      return 2 * frac - 1;
    }
    default:
      return Math.sin(phase);
  }
}

function getMsPerDiv() {
  return MS_PER_DIV_STEPS[msPerDivStepIndex];
}

function getTotalWindowSec() {
  return (HORIZ_DIVS * getMsPerDiv()) / 1000;
}

function syncTimebaseUI() {
  const label = formatMsPerDivLabel(getMsPerDiv());
  document.getElementById('tbLabel').textContent = label;
  document.getElementById('scopeTimebase').textContent = label;
  document.getElementById('tbMinus').disabled = msPerDivStepIndex <= 0;
  document.getElementById('tbPlus').disabled = msPerDivStepIndex >= MS_PER_DIV_STEPS.length - 1;
}

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.25;
    masterGain.connect(audioCtx.destination);
  }
  return audioCtx;
}

function audioHz(hz) {
  return Math.max(0.001, hz);
}

function startAudio() {
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  waves.forEach(w => {
    if (!oscillators[w.id]) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = w.type === 'sawtooth' ? 'sawtooth' : w.type === 'square' ? 'square' : w.type === 'triangle' ? 'triangle' : 'sine';
      osc.frequency.value = audioHz(w.hz);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(w.amp, ctx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      oscillators[w.id] = osc;
      gainNodes[w.id] = gain;
    }
  });
}

function stopAudio() {
  const ctx = audioCtx;
  if (!ctx) {
    oscillators = {};
    gainNodes = {};
    return;
  }
  const now = ctx.currentTime;
  Object.keys(gainNodes).forEach(id => {
    const g = gainNodes[id];
    if (g) {
      try {
        const cur = g.gain.value;
        g.gain.cancelScheduledValues(now);
        g.gain.setValueAtTime(cur, now);
        g.gain.linearRampToValueAtTime(0, now + 0.08);
      } catch (e) {}
    }
  });
  const dead = Object.values(oscillators);
  oscillators = {};
  gainNodes = {};
  setTimeout(() => {
    dead.forEach(o => { try { o.stop(); } catch (e) {} });
  }, 150);
}

function syncOscillator(w) {
  if (!isPlaying || !oscillators[w.id] || !audioCtx) return;
  const osc = oscillators[w.id];
  const gain = gainNodes[w.id];
  const now = audioCtx.currentTime;
  const typeMap = { sine: 'sine', triangle: 'triangle', square: 'square', sawtooth: 'sawtooth' };
  osc.type = typeMap[w.type] || 'sine';
  osc.frequency.setTargetAtTime(audioHz(w.hz), now, 0.008);
  const cur = gain.gain.value;
  gain.gain.cancelScheduledValues(now);
  gain.gain.setValueAtTime(cur, now);
  gain.gain.setTargetAtTime(w.amp, now, (cur < 0.02 && w.amp > 0) ? 0.06 : 0.008);
}

function addOscForWave(w) {
  if (!isPlaying || !audioCtx) return;
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = w.type === 'sawtooth' ? 'sawtooth' : w.type === 'square' ? 'square' : w.type === 'triangle' ? 'triangle' : 'sine';
  osc.frequency.value = audioHz(w.hz);
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(w.amp, ctx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start();
  oscillators[w.id] = osc;
  gainNodes[w.id] = gain;
}

function removeOscForWave(id) {
  if (oscillators[id] && audioCtx) {
    const now = audioCtx.currentTime;
    const gain = gainNodes[id];
    const osc = oscillators[id];
    try {
      const cur = gain.gain.value;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(cur, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.08);
    } catch (e) {}
    delete oscillators[id];
    delete gainNodes[id];
    setTimeout(() => { try { osc.stop(); } catch (e) {} }, 150);
  }
}

document.getElementById('playBtn').addEventListener('click', () => {
  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');
  const label = document.getElementById('playLabel');
  const status = document.getElementById('audioStatus');
  if (isPlaying) {
    try {
      startAudio();
      status.textContent = '';
    } catch (err) {
      isPlaying = false;
      oscillators = {};
      gainNodes = {};
      status.textContent = 'Sound could not start in this browser. The scope still works without it.';
      return;
    }
    btn.classList.add('playing');
    label.textContent = 'Stop';
  } else {
    stopAudio();
    btn.classList.remove('playing');
    label.textContent = 'Play';
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && isPlaying) {
    isPlaying = false;
    stopAudio();
    const btn = document.getElementById('playBtn');
    btn.classList.remove('playing');
    document.getElementById('playLabel').textContent = 'Play';
  }
});

function makeWaveFromPreset(p, idx) {
  return {
    id: nextId++,
    type: p.type,
    hz: p.hz,
    amp: p.amp,
    color: p.color || COLORS[idx % COLORS.length],
  };
}

function loadCMajorDefault() {
  stopAudio();
  isPlaying = false;
  const btn = document.getElementById('playBtn');
  btn.classList.remove('playing');
  document.getElementById('playLabel').textContent = 'Play';
  nextId = 0;
  waves = C_MAJOR_DEFAULT.map((p, i) => makeWaveFromPreset(p, i));
  msPerDivStepIndex = DEFAULT_MS_PER_DIV_INDEX;
  document.getElementById('showSum').checked = false;
  syncTimebaseUI();
  renderControls();
  draw();
}

// Equal temperament, A4 = 440 Hz. Root sits in octave 4 (C4 … B4).
function midiToHz(m) {
  return Math.round(440 * Math.pow(2, (m - 69) / 12) * 100) / 100;
}

function chordName(rootIdx, quality) {
  return NOTE_NAMES[rootIdx] + quality.suffix;
}

function setActiveChord(key) {
  document.querySelectorAll('.chord-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.chord === key);
  });
  const hint = document.getElementById('chordHint');
  if (!hint) return;
  if (key) {
    const [qKey, root] = key.split(':');
    const q = CHORD_QUALITIES.find(x => x.key === qKey);
    const r = +root;
    hint.textContent = chordName(r, q) + ' · ' + q.intervals.map(i => NOTE_NAMES[(r + i) % 12]).join(' ');
  } else {
    hint.textContent = 'Pick a chord to load its notes as sine waves';
  }
}

function applyChord(rootIdx, quality) {
  const rootMidi = 60 + rootIdx;
  const presets = quality.intervals.slice(0, MAX_WAVES).map((iv, i) => ({
    type: 'sine',
    hz: midiToHz(rootMidi + iv),
    amp: 0.5,
    color: COLORS[i % COLORS.length],
  }));
  // Swap out any running oscillators for the new notes; addOscForWave is a
  // no-op while paused, so a paused scope just updates silently.
  waves.forEach(w => removeOscForWave(w.id));
  waves = presets.map((p, i) => makeWaveFromPreset(p, i));
  waves.forEach(w => addOscForWave(w));
  setActiveChord(quality.key + ':' + rootIdx);
  renderControls();
  draw();
}

// One row per root letter, starting from A. Every chord in a row is built
// on that row's letter (A, Am, A°, A+, … all use A as the root).
const ROOT_ORDER = Array.from({ length: 12 }, (_, i) => (9 + i) % 12); // A, A♯, B, C, … G♯

function buildChordTable() {
  const table = document.getElementById('chordTable');
  table.innerHTML = '';
  ROOT_ORDER.forEach(r => {
    const row = document.createElement('div');
    row.className = 'chord-row';
    const label = document.createElement('span');
    label.className = 'chord-row-label';
    label.textContent = NOTE_NAMES[r];
    const btns = document.createElement('div');
    btns.className = 'chord-buttons';
    CHORD_QUALITIES.forEach(q => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chord-btn';
      b.dataset.chord = q.key + ':' + r;
      b.textContent = chordName(r, q);
      b.title = chordName(r, q) + ' (' + q.label + '): ' +
        q.intervals.map(i => NOTE_NAMES[(r + i) % 12]).join(' – ');
      b.addEventListener('click', () => applyChord(r, q));
      btns.appendChild(b);
    });
    row.appendChild(label);
    row.appendChild(btns);
    table.appendChild(row);
  });
}

function addWave() {
  if (waves.length >= MAX_WAVES) return;
  const used = new Set(waves.map(w => w.color));
  const color = COLORS.find(c => !used.has(c)) || COLORS[waves.length % COLORS.length];
  const w = {
    id: nextId++,
    type: 'sine',
    hz: Math.min(MAX_HZ, Math.round(110 * (1 + waves.length * 0.5))),
    amp: 0.5,
    color,
  };
  waves.push(w);
  addOscForWave(w);
  setActiveChord(null);
  renderControls();
  draw();
}

function removeWave(id) {
  removeOscForWave(id);
  waves = waves.filter(w => w.id !== id);
  setActiveChord(null);
  renderControls();
  draw();
}

function getScopeHeightPx() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue('--scope-height').trim();
  const n = parseFloat(raw);
  return Number.isFinite(n) && n > 0 ? n : 240;
}

function draw() {
  const canvas = document.getElementById('waveCanvas');
  const W = canvas.offsetWidth;
  if (!W) return;
  const H = getScopeHeightPx();
  const DPR = window.devicePixelRatio || 1;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  const mid = H / 2;
  const showSum = document.getElementById('showSum').checked;
  const totalWindowSec = getTotalWindowSec();
  const pts = PTS;

  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(168,219,114,0.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (i / 4) * H;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  for (let i = 1; i < 8; i++) {
    const x = (i / 8) * W;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(168,219,114,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, mid);
  ctx.lineTo(W, mid);
  ctx.stroke();

  const sumY = new Array(pts).fill(0);

  waves.forEach(w => {
    ctx.strokeStyle = w.color;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = showSum ? 0.45 : 0.85;

    if (w.amp === 0) {
      ctx.beginPath();
      ctx.moveTo(0, mid);
      ctx.lineTo(W, mid);
      ctx.stroke();
    } else {
      ctx.beginPath();
      for (let i = 0; i <= pts; i++) {
        const t = i / pts;
        const x = t * W;
        const tSec = t * totalWindowSec;
        const v = waveValueAtTime(w, tSec) * w.amp;
        const y = mid - v * H * 0.42;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        if (i < pts) sumY[i] += v;
      }
      ctx.stroke();
    }
  });

  if (showSum && waves.length > 1) {
    const maxAbs = Math.max(...sumY.map(Math.abs), 0.001);
    ctx.strokeStyle = 'rgba(236,232,223,0.9)';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 1;
    ctx.setLineDash([5, 3]);
    ctx.beginPath();
    for (let i = 0; i < pts; i++) {
      const x = (i / pts) * W;
      const norm = maxAbs > 1 ? maxAbs : 1;
      const v = sumY[i] / norm;
      const y = mid - v * H * 0.42;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.globalAlpha = 1;
  updateLegend(showSum);
}

function updateLegend(showSum) {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  waves.forEach(w => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const line = document.createElement('div');
    line.className = 'legend-line';
    line.style.background = w.amp === 0 ? 'rgba(255,255,255,0.2)' : w.color;
    item.appendChild(line);
    item.appendChild(document.createTextNode(
      Math.round(w.hz) + ' Hz · ' + w.type + (w.amp === 0 ? ' [muted]' : '')
    ));
    legend.appendChild(item);
  });
  if (showSum && waves.length > 1) {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const line = document.createElement('div');
    line.className = 'legend-line sum';
    item.appendChild(line);
    item.appendChild(document.createTextNode('sum'));
    legend.appendChild(item);
  }
}

const SHAPE_PATHS = {
  sine: 'M1 6 Q6.5 -4 12 6 T23 6',
  triangle: 'M1 6 L6.5 1 L17.5 11 L23 6',
  square: 'M1 10 V2 H12 V10 H23 V2',
  sawtooth: 'M1 10 L12 2 V10 L23 2 V10',
};
const SHAPE_NAMES = { sine: 'Sine', triangle: 'Triangle', square: 'Square', sawtooth: 'Sawtooth' };

function shapeSvg(type) {
  return `<svg viewBox="0 0 24 12" aria-hidden="true" focusable="false"><path d="${SHAPE_PATHS[type]}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function renderControls() {
  const container = document.getElementById('waveControls');
  container.innerHTML = '';
  document.getElementById('addBtn').disabled = waves.length >= MAX_WAVES;
  document.getElementById('addBtn').title = waves.length >= MAX_WAVES ? 'Up to ' + MAX_WAVES + ' waves at once' : '';
  document.getElementById('waveCount').textContent = waves.length + ' of ' + MAX_WAVES;

  if (waves.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'empty-state';
    empty.textContent = 'No waves yet. Add a wave or pick a chord below.';
    container.appendChild(empty);
  }

  waves.forEach((w, idx) => {
    const row = document.createElement('div');
    row.className = 'wave-row' + (w.amp === 0 ? ' muted' : '');
    row.id = 'row-' + w.id;
    row.style.setProperty('--wc', w.color);

    const ident = document.createElement('div');
    ident.className = 'wave-id';
    ident.innerHTML = `<span id="glyph${w.id}">${shapeSvg(w.type)}</span>
      <span class="wave-num">Wave ${idx + 1}</span><span class="muted-tag">Muted</span>`;

    const freqP = document.createElement('div');
    freqP.className = 'param p-freq';
    const norm = hzToSliderNorm(w.hz);
    freqP.innerHTML = `<div class="param-head">
        <label for="hz${w.id}">Frequency</label>
        <span class="freq-field">
          <input type="text" inputmode="decimal" class="freq-input" id="fi${w.id}" data-id="${w.id}" value="${formatHz(w.hz)}" aria-label="Wave ${idx + 1} frequency in hertz">Hz
        </span>
      </div>
      <input type="range" id="hz${w.id}" min="0" max="1" step="0.001" value="${norm}" data-id="${w.id}" data-prop="hzNorm">`;

    const ampP = document.createElement('div');
    ampP.className = 'param p-amp';
    ampP.innerHTML = `<div class="param-head">
        <label for="amp${w.id}">Amplitude</label>
        <span class="param-val" id="av${w.id}">${w.amp === 0 ? 'Muted' : Math.round(w.amp * 100) + '%'}</span>
      </div>
      <input type="range" id="amp${w.id}" min="0" max="1" step="0.01" value="${w.amp}" data-id="${w.id}" data-prop="amp">`;

    const shapeP = document.createElement('div');
    shapeP.className = 'param p-shape';
    const shapeHead = document.createElement('div');
    shapeHead.className = 'param-head';
    shapeHead.innerHTML = `<span class="label" id="shapeLbl${w.id}">Shape</span>`;
    const wt = document.createElement('div');
    wt.className = 'wave-type';
    wt.id = 'wt' + w.id;
    wt.setAttribute('role', 'group');
    wt.setAttribute('aria-labelledby', 'shapeLbl' + w.id);
    WAVE_TYPES.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = shapeSvg(t);
      b.title = SHAPE_NAMES[t];
      b.setAttribute('aria-label', SHAPE_NAMES[t]);
      b.dataset.id = w.id;
      b.dataset.type = t;
      const on = w.type === t;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', String(on));
      b.addEventListener('click', e => {
        const id = +e.currentTarget.dataset.id;
        const type = e.currentTarget.dataset.type;
        const wv = waves.find(x => x.id === id);
        if (!wv) return;
        wv.type = type;
        document.querySelectorAll('#wt' + id + ' button').forEach(x => {
          const sel = x.dataset.type === type;
          x.classList.toggle('active', sel);
          x.setAttribute('aria-pressed', String(sel));
        });
        const glyph = document.getElementById('glyph' + id);
        if (glyph) glyph.innerHTML = shapeSvg(type);
        syncOscillator(wv);
        draw();
      });
      wt.appendChild(b);
    });
    shapeP.appendChild(shapeHead);
    shapeP.appendChild(wt);

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-btn';
    removeBtn.title = 'Remove wave ' + (idx + 1);
    removeBtn.setAttribute('aria-label', 'Remove wave ' + (idx + 1));
    removeBtn.innerHTML = '<svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M2 2 L12 12 M12 2 L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    removeBtn.addEventListener('click', () => removeWave(w.id));

    row.appendChild(ident);
    row.appendChild(freqP);
    row.appendChild(ampP);
    row.appendChild(shapeP);
    row.appendChild(removeBtn);
    container.appendChild(row);
  });

  container.querySelectorAll('input[type=range]').forEach(el => {
    el.addEventListener('input', e => {
      const id = +e.target.dataset.id;
      const prop = e.target.dataset.prop;
      const wv = waves.find(w => w.id === id);
      if (!wv) return;
      if (prop === 'hzNorm') {
        let p = parseFloat(e.target.value);
        p = Math.min(1, Math.max(0, p));
        if (hzToSliderNorm(wv.hz) > 0.9 && p <= 0.0001 && wv.hz >= 2000) return;
        wv.hz = sliderNormToHz(p);
        setActiveChord(null);
        const fv = document.getElementById('fv' + id);
        if (fv) fv.textContent = formatFvHz(wv.hz);
        const fi = document.getElementById('fi' + id);
        if (fi) fi.value = formatHz(wv.hz);
      } else if (prop === 'amp') {
        const val = Math.round(parseFloat(e.target.value) * 100) / 100;
        wv.amp = val;
        document.getElementById('av' + id).textContent = val === 0 ? 'Muted' : Math.round(val * 100) + '%';
        const rowEl = document.getElementById('row-' + id);
        if (rowEl) rowEl.classList.toggle('muted', val === 0);
      }
      syncOscillator(wv);
      draw();
    });
  });

  container.querySelectorAll('.freq-input').forEach(el => {
    el.addEventListener('input', e => {
      e.target.value = sanitizeHzInput(e.target.value);
      const id = +e.target.dataset.id;
    });
    const commit = e => {
      const id = +e.target.dataset.id;
      const wv = waves.find(w => w.id === id);
      if (!wv) return;
      const n = parseHzCommit(e.target.value.trim());
      if (n === null) {
        e.target.value = formatHz(wv.hz);
        const lab = document.getElementById('fv' + id);
        if (lab) lab.textContent = formatFvHz(wv.hz);
        return;
      }
      if (n !== wv.hz) setActiveChord(null);
      wv.hz = n;
      e.target.value = formatHz(wv.hz);
      const slider = container.querySelector(`input[data-prop="hzNorm"][data-id="${id}"]`);
      if (slider) slider.value = String(hzToSliderNorm(wv.hz));
      const lab = document.getElementById('fv' + id);
      if (lab) lab.textContent = formatFvHz(wv.hz);
      syncOscillator(wv);
      draw();
    };
    el.addEventListener('change', commit);
    el.addEventListener('blur', commit);
  });
}

document.getElementById('addBtn').addEventListener('click', addWave);
document.getElementById('showSum').addEventListener('change', draw);
document.getElementById('tbMinus').addEventListener('click', () => {
  if (msPerDivStepIndex <= 0) return;
  msPerDivStepIndex--;
  syncTimebaseUI();
  draw();
});
document.getElementById('tbPlus').addEventListener('click', () => {
  if (msPerDivStepIndex >= MS_PER_DIV_STEPS.length - 1) return;
  msPerDivStepIndex++;
  syncTimebaseUI();
  draw();
});
window.addEventListener('resize', draw);

buildChordTable();
loadCMajorDefault();
setActiveChord('maj:0');
</script>
</body>
</html>
